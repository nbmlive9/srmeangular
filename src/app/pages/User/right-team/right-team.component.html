  </div>
</div>

<div class="container mt-3 mb-5">
  <h3 class="mb-4 text-primary fw-bold">Right Team</h3>

  <!-- Optional Date Filter -->
  <!-- <div class="row g-3 mb-4">
    <div class="col-12 col-md-4">
      <label for="startDate" class="form-label fw-semibold">From Date</label>
      <input type="date" class="form-control shadow-sm" [(ngModel)]="startDate" id="startDate">
    </div>
    <div class="col-12 col-md-4">
      <label for="endDate" class="form-label fw-semibold">To Date</label>
      <input type="date" class="form-control shadow-sm" [(ngModel)]="endDate" id="endDate">
    </div>
    <div class="col-12 col-md-4 d-grid">
      <button class="btn btn-primary btn-sm shadow-sm" (click)="applyDateFilter()">
        Search
      </button>
    </div>
  </div> -->

  <!-- Scrollable container -->
  <div class="scroll-container overflow-auto mb-3" style="max-height: 70vh;" (scroll)="onScroll($event)">
    <!-- <div class="mb-3 fw-semibold fs-5 text-secondary">Team Members</div> -->

    <div class="table-responsive">
      <table class="table table-striped custom-table mb-0">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Date</th>
            <th>Userid</th>
            <th>Level</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let wd of pro; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ wd.crdate | date: 'dd/MM/yyyy' }}</td>
            <td>{{ wd.ref_id }}</td>
            <td>{{ wd.level }}</td>
            <td>
              <span class="badge badge-danger" *ngIf="wd.status === '0'">Not Activated</span>
              <span class="badge badge-success" *ngIf="wd.status === '1'">Activated</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Loading -->
    <div class="text-center mt-3" *ngIf="loading">
      <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="text-primary fw-semibold">Loading more users...</p>
    </div>

    <!-- No More -->
    <div class="text-center mt-3" *ngIf="allLoaded && pro.length > 0">
      <p class="text-muted fw-semibold">All team members loaded</p>
    </div>

    <!-- No Data -->
    <div class="text-center mt-5" *ngIf="!loading && pro.length === 0">
      <p class="text-muted fw-semibold fs-6">No team members found</p>
    </div>
  </div>
</div>
